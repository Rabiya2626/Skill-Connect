{% extends 'marketing_base.html' %}
{% block head %}<style>
  .auth-page{max-width:500px;margin:72px auto;padding:0 24px}.auth-card{padding:32px}.auth-card h1{font-size:28px;margin-top:10px}.form-row{margin-top:16px}.form-row label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}.form-row input,.form-row select,.form-row textarea{width:100%;padding:11px 12px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);font:inherit;background:var(--white);color:var(--ink)}.form-row textarea{min-height:90px;resize:vertical}.field-error{font-size:12px;color:var(--danger);margin-top:5px}.auth-foot{text-align:center;margin-top:18px;font-size:13px}
</style>{% endblock %}
{% block content %}<main class="auth-page">{% block auth_content %}{% endblock %}</main>{% endblock %}
