<div class="topbar">
  <form class="search-field" action="{{ url_for('skills.browse') }}"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6"></circle><path d="m20 20-4.2-4.2"></path></svg><input name="q" value="{{ request.args.get('q', '') }}" placeholder="Search skills, tutors, or sessions…" aria-label="Search skills and tutors"></form>
  <div class="topbar-actions">
    <a href="{{ url_for('notifications.index') }}" class="icon-btn" aria-label="Notifications"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>{% if unread_notification_count %}<span class="dot"></span>{% endif %}</a>
    {% if current_user.tutor %}<a class="btn btn-ghost btn-sm topbar-label" href="{{ url_for('tutors.profile', user_id=current_user.id) }}">View profile</a>{% endif %}
    <a class="btn btn-amber btn-sm topbar-label" href="{{ url_for('skills.my_skills') }}">{{ 'Add learning goal' if current_user.role == 'learner' else 'Offer a skill' }}</a>
    <form method="post" action="{{ url_for('auth.logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-ghost btn-sm topbar-label">Log out</button></form>
  </div>
</div>
