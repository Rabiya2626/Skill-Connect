{% extends 'base.html' %}
{% block title %}Test checkout — SkillConnect{% endblock %}
{% block content %}<section class="card panel" style="max-width:620px"><span class="badge badge-amber">Razorpay Test Mode</span><h1 style="font-size:26px;margin-top:14px">Pay for {{ session.skill.name }}</h1><p>₹{{ '%.2f'|format(payment.amount_paise / 100) }} · No real money will be charged.</p><button id="pay-button" class="btn btn-amber">Open test checkout</button><form id="payment-form" method="post" action="{{ url_for('payments.verify_payment') }}"><input type="hidden" name="razorpay_payment_id"><input type="hidden" name="razorpay_order_id"><input type="hidden" name="razorpay_signature"></form></section><script src="https://checkout.razorpay.com/v1/checkout.js"></script><script>document.getElementById('pay-button').onclick=function(e){e.preventDefault();new Razorpay({key:'{{ key_id }}',amount:'{{ payment.amount_paise }}',currency:'INR',name:'SkillConnect',description:'{{ session.skill.name }} session — test mode',order_id:'{{ order_id }}',handler:function(r){var f=document.getElementById('payment-form');f.razorpay_payment_id.value=r.razorpay_payment_id;f.razorpay_order_id.value=r.razorpay_order_id;f.razorpay_signature.value=r.razorpay_signature;f.submit();}}).open();};</script>{% endblock %}
